apiVersion: batch/v1
kind: Job
metadata:
  name: relay-opd-eval-{{ORX_RUN}}
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 14400
  template:
    spec:
      restartPolicy: Never
      tolerations:
        - operator: Exists
          effect: NoSchedule
      containers:
        - name: run
          image: vllm/vllm-openai:v0.21.0
          imagePullPolicy: IfNotPresent
          command: ["bash", "-c", "eval \"$ORX_SCRIPT\""]
          resources:
            requests:
              nvidia.com/gpu: "8"
              cpu: "48"
              memory: 256Gi
            limits:
              nvidia.com/gpu: "8"
              cpu: "96"
              memory: 512Gi
          volumeMounts:
            - name: dshm
              mountPath: /dev/shm
      volumes:
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 128Gi
